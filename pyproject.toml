[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "made-core"
version = "0.1.0"
description = "Modular Anomaly Detection Engine domain contracts"
requires-python = ">=3.13"
dependencies = [
    "pydantic>=2,<3",
    "pydantic-settings>=2,<3",
    "redis>=5,<9",
    "sqlalchemy>=2,<3",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "httpx>=0.27,<1",
    "fastapi>=0.115",
    "uvicorn>=0.30",
]



[project.optional-dependencies]
dev = [
    "pytest>=8,<10",
    "pytest-asyncio>=0.23",
    "aiosqlite>=0.20",
    "matplotlib>=3.8",
    "pyyaml>=6.0",
]

[tool.pytest.ini_options]
testpaths = ["services/made-core/tests", "services/api/tests", "experiments/tests"]
pythonpath = ["services/made-core/src", "services/api/src", "."]
markers = [
    "integration: marks tests requiring real external containers/services (deselect with '-m \"not integration\"')",
    "live: marks tests requiring live external network access (deselect with '-m \"not live\"')",
]

[tool.setuptools.packages.find]
where = ["services/made-core/src", "services/api/src", "."]


